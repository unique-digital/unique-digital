
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UNIQUE DIGITAL - Photo Editor</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f5f9;color:#172033;font-family:Arial,sans-serif}
header{background:#10264d;color:white;text-align:center;padding:22px}
main{max-width:650px;margin:24px auto;padding:12px}
.card{background:white;padding:20px;border-radius:14px;box-shadow:0 4px 18px #0001}
label{display:block;font-weight:bold;margin:16px 0 8px}
input,select,button{width:100%;padding:12px;font:inherit;border-radius:8px}
input,select{border:1px solid #cbd5e1;background:white}
button{border:0;font-weight:bold;cursor:pointer;margin-top:12px}
.primary{background:#1769e0;color:white}
.download{background:#087b48;color:white}
button:disabled{opacity:.5}
#status{margin-top:15px;padding:12px;background:#eff6ff;border-radius:8px;overflow-wrap:anywhere}
#preview{text-align:center;margin-top:20px}
canvas{max-width:100%;height:auto;border:1px solid #ddd}
#color{width:65px}
.note{font-size:13px;color:#64748b;line-height:1.5}
</style>
</head>
<body>
<header>
<h1>UNIQUE DIGITAL</h1>
<p>AI Passport Photo Maker</p>
</header>
<main>
<section class="card">
<h2>Background Remover</h2>
<p>Photo upload karein, background hatayein aur download karein.</p>

<label for="photo">1. Photo select karein</label>
<input id="photo" type="file" accept="image/*">

<label for="size">2. Photo size</label>
<select id="size">
<option value="passport">1.2 × 1.4 inch — 360 × 420 px</option>
<option value="square">2 × 2 inch — 600 × 600 px</option>
<option value="original">Original size</option>
</select>

<label for="bg">3. Background</label>
<select id="bg">
<option value="white">White Background</option>
<option value="color">Custom Color</option>
<option value="transparent">Transparent PNG</option>
</select>

<div id="colorBox" hidden>
<label for="color">Background color</label>
<input id="color" type="color" value="#ffffff">
</div>

<button class="primary" id="process">AI Background Remove Karein</button>
<div id="status">Pehle photo select karein.</div>

<div id="preview" hidden>
<h3>Final Photo</h3>
<canvas id="canvas"></canvas>
<p id="dims"></p>
<button class="download" id="save">Photo Download Karein</button>
</div>

<p class="note">Pehli baar AI model download hone mein samay lag sakta hai. Internet chalu rakhein. Photo processing browser mein hoti hai.</p>
</section>
</main>

<script type="module">
const $ = id => document.getElementById(id);
const photo = $('photo');
const bg = $('bg');
const color = $('color');
const size = $('size');
const canvas = $('canvas');
const ctx = canvas.getContext('2d');
let file = null;
let cutout = null;
let removeAI = null;
let busy = false;

function say(msg){ $('status').textContent = msg; }

photo.addEventListener('change', () => {
  file = photo.files[0] || null;
  cutout = null;
  $('preview').hidden = true;
  say(file ? 'Photo select ho gayi. AI button dabayein.' : 'Photo select karein.');
});

bg.addEventListener('change', async () => {
  $('colorBox').hidden = bg.value !== 'color';
  if(cutout) await render();
});

color.addEventListener('input', async () => {
  if(cutout && bg.value === 'color') await render();
});

size.addEventListener('change', async () => {
  if(cutout) await render();
});

async function getAI(){
  if(removeAI) return removeAI;
  say('AI library load ho rahi hai. Pehli baar intezar karein...');
  const mod = await import(
    'https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/+esm'
  );
  removeAI = mod.default || mod.removeBackground;
  if(typeof removeAI !== 'function'){
    throw new Error('AI function nahi mili.');
  }
  return removeAI;
}

$('process').addEventListener('click', async () => {
  if(busy) return;
  if(!file){
    say('Pehle apni photo select karein.');
    return;
  }

  busy = true;
  $('process').disabled = true;
  $('preview').hidden = true;

  try {
    const remove = await getAI();
    say('AI background remove kar raha hai. Kripya intezar karein...');

    const result = await remove(file);

    if(!result || result.size === 0){
      throw new Error('AI se image nahi mili.');
    }

    cutout = result;
    await render();
    $('preview').hidden = false;
    say('Background remove ho gaya. Ab photo download karein.');

  } catch(e) {
    console.error('AI error:', e);
    cutout = null;
    say('AI ERROR: ' + (e?.message || String(e)) +
      '. Internet check karein. Error dobara aaye toh F12 Console check karein.');
  } finally {
    busy = false;
    $('process').disabled = false;
  }
});

function loadImage(blob){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      resolve(img);
    };
    img.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error('Image open nahi hui.'));
    };
    img.src = url;
  });
}

async function render(){
  if(!cutout) return;

  const img = await loadImage(cutout);
  let w = img.naturalWidth, h = img.naturalHeight;

  if(size.value === 'passport'){w=360;h=420;}
  if(size.value === 'square'){w=600;h=600;}

  canvas.width = w;
  canvas.height = h;
  ctx.clearRect(0,0,w,h);

  if(bg.value === 'white' || bg.value === 'color'){
    ctx.fillStyle = bg.value === 'white' ? '#ffffff' : color.value;
    ctx.fillRect(0,0,w,h);
  }

  const scale = Math.min(w/img.width,h/img.height);
  const dw = img.width*scale;
  const dh = img.height*scale;
  ctx.drawImage(img,(w-dw)/2,(h-dh)/2,dw,dh);

  $('dims').textContent = w + ' × ' + h + ' pixels';
  $('preview').hidden = false;
}

$('save').addEventListener('click', () => {
  if(!cutout || !canvas.width){
    say('Pehle AI background remove karein.');
    return;
  }

  canvas.toBlob(blob => {
    if(!blob){
      say('Photo download nahi ban paayi.');
      return;
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = bg.value === 'transparent'
      ? 'unique-digital-transparent.png'
      : 'unique-digital-passport.png';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url),2000);
    say('Photo download shuru ho gaya!');
  },'image/png');
});
</script>
</body>
</html>
